server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8099/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: service-customer
          uri: lb://service-customer
          predicates:
            - Path=/api/v1/customers/**

        - id: service-product
          uri: lb://service-product
          predicates:
            - Path=/api/v1/products/**

        - id: service-shopping
          uri: lb://service-shopping
          predicates:
            - Path=/api/v1/invoices/**