spring:
  application:
    name: registry-service
  cloud:
    config:
      enabled: false

server:
  port: 8099

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
